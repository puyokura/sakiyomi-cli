name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to build the current ref."
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl needs a linker for the cross builds; arm64 on x86 needs gcc-aarch64.
      - name: install musl tooling
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="sakiyomi-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ -f "target/${{ matrix.target }}/release/sakiyomi.exe" ]; then
            cp "target/${{ matrix.target }}/release/sakiyomi.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/sakiyomi" "dist/$NAME/"
          fi
          cp README.md VERIFICATION.md "dist/$NAME/" 2>/dev/null || true
          if [ -f "target/${{ matrix.target }}/release/sakiyomi.exe" ]; then
            (cd "dist/$NAME" && 7z a -tzip "../$NAME.zip" . > /dev/null)
            echo "ASSET=dist/$NAME.zip" >> "$GITHUB_ENV"
          else
            tar -C "dist/$NAME" -czf "dist/$NAME.tar.gz" .
            echo "ASSET=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: verify the packaged binary runs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "dist/sakiyomi-${{ matrix.target }}/sakiyomi.exe" ] && [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/sakiyomi-${{ matrix.target }}/sakiyomi.exe --version
          elif [ "${{ runner.os }}" != "Linux" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            ./dist/sakiyomi-${{ matrix.target }}/sakiyomi --version
          else
            echo "cross-built for ${{ matrix.target }}; not executable on this runner"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sakiyomi-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: checksums
        shell: bash
        run: |
          cd assets
          ls -la
          sha256sum *.zip *.tar.gz > ../SHA256SUMS.txt 2>/dev/null || sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            assets/*.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 変更点
            ${{ github.event.head_commit.message || 'See the commit history.' }}

            ## 新機能
            - ヘッドレス（サーバー / SSH）から Google ログインできる `auth login`（URL を表示し、ブラウザでログインすると自動で終了する）
            - `auth callback --relay` による、ブラウザ側マシンから待機中のマシンへのリダイレクト転送

            ## 注意点
            - これは非公式のクライアントで、サキヨミの開発元とは関係ありません。
            - 金銭が動く操作は確認プロンプト付きです。`--dry-run` で送信内容を先に確認してください。
            - ログインは Google の OAuth を使います。メール+パスワードのログインはアプリに存在しません。
