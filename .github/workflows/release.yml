name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to build the current ref."
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl needs a linker for the cross builds; arm64 on x86 needs gcc-aarch64.
      - name: install musl tooling
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="sakiyomi-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ -f "target/${{ matrix.target }}/release/sakiyomi.exe" ]; then
            cp "target/${{ matrix.target }}/release/sakiyomi.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/sakiyomi" "dist/$NAME/"
          fi
          cp README.md VERIFICATION.md "dist/$NAME/" 2>/dev/null || true
          if [ -f "target/${{ matrix.target }}/release/sakiyomi.exe" ]; then
            (cd "dist/$NAME" && 7z a -tzip "../$NAME.zip" . > /dev/null)
            echo "ASSET=dist/$NAME.zip" >> "$GITHUB_ENV"
          else
            tar -C "dist/$NAME" -czf "dist/$NAME.tar.gz" .
            echo "ASSET=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: verify the packaged binary runs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "dist/sakiyomi-${{ matrix.target }}/sakiyomi.exe" ] && [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/sakiyomi-${{ matrix.target }}/sakiyomi.exe --version
          elif [ "${{ runner.os }}" != "Linux" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            ./dist/sakiyomi-${{ matrix.target }}/sakiyomi --version
          else
            echo "cross-built for ${{ matrix.target }}; not executable on this runner"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sakiyomi-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: checksums
        shell: bash
        run: |
          cd assets
          ls -la
          sha256sum *.zip *.tar.gz > ../SHA256SUMS.txt 2>/dev/null || sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            assets/*.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 変更点
            - `buy` と `schedule` の `--stake` の説明が「ポイント」になっていましたが、
              実測ではサーバーは **コイン** を引きます（`coins` が減り `points` は動かない）。
              説明を訂正し、`--stake` の許容範囲（10〜100,000）も送信前に検査します。
            - `wave status` が広告の本数とミニゲームの受取を混同していたのを直しました。
              応答を `ads` と `minigame` に分け、ミニゲーム側は台帳から当日分を集計します。
            - 同日 2 回目のクリアで `reward: null` になるのは正常です。`wave play` が
              その理由を stderr に注記するようになりました。
            - 0.5.0 の文書にあった `prob` の説明が誤っていたため訂正しました。
              `prob` は `weight / Σweight`（表示用の確率）で、買付価格 `buy_prob` は
              `(weight + stake) / (total_weight + stake)` です。分母が違うため両者は一致しません。
              0.5.0 のコード（推定値の計算）は正しく、説明だけが誤っていました。
            - `quiz` をサブコマンド化しました。`quiz create`（従来の投稿）と `quiz list`（自分の
              クイズと審査状況の確認）です。MCP にしか無かった `quizzes_mine` と同じ内容を
              CLI からも読めます。
            - `events list` / `events show` に `--stake` を追加しました。各選択肢に
              買付時の `buy_prob` と `shares` を併記します。一覧の `prob` は書き換えません。
            - `events list --ids` が 50 件を超えると HTTP 400 になっていた問題を修正しました。
              サーバーの上限は 50 件（実測）で、`next_ids` は 300 件あるため必ず失敗していました。
              内部で 50 件ずつに分割し、結果を 1 つの JSON にまとめて返します。
            - `positions` に払い戻しの受取を追加しました（`positions claim <id>` / `positions claim all`）。
            - `buy --dry-run` が買付後の `buy_prob` と `shares` の推定も表示するようになりました。
            - セッションが要る操作のエラー案内が、存在しない `auth login` を指していました。
              `auth import-token` に直しました。

            ## 新機能
             - **`schedule`**: 「何時何分にどれに何コイン払う」を予約しておけるようになりました。
              `schedule add --at ... --event ... --option ... --stake ...` で予約し、
              `schedule run` が常駐して時刻が来たら買います。予約はファイルに残り、
              落ちても `in_flight` の印が残るので二重購入を避けられます。
             - **`wave status` の分割**: 広告の本数とミニゲームの当日受取を別項目で返します。
             - **`quiz list`**: 自分のクイズの一覧と審査状況（pending / approved / rejected）、
              運営の審査コメント、採用ボーナスを表示します。`--status` で絞り込めます。
            - **`events list --stake`**: 一覧のまま、各選択肢の買付確率と取得予定 shares を比較できます。
            - **`bonus status`**: 今日もらえるコイン（ログインボーナス、広告、ミニゲーム）を表示します。
            - **`wave play`**: ミニゲーム（波よみジャンプ）を画面なしで遊び、クリア分のコインを受け取ります。
              サーバーはタップ時刻の列を自分のレベルで再生して結果を決めるため、画面を作る必要がありません。
            - **`quiz`**: クイズを作成します（`POST /quizzes`）。
            - **`positions claim`**: 確定した的中分の払い戻しを受け取ります。`all` で未受取をまとめて処理します。
            - **MCP**: `bonus_status` / `wave_play` / `quiz_create` / `quizzes_mine` / `position_claim` を追加しました。
            - **`tools/token-extract`**: ルート化した端末からアプリのセッションを取り出す手順とスクリプトを同梱しています。

            ## 注意点
            - これは非公式のクライアントで、サキヨミの開発元とは関係ありません。
            - 金銭が動く操作は確認プロンプト付きです。`--dry-run` で送信内容を先に確認してください。
             - **一覧の `prob` と `buy_prob` は別の量です。** `prob` は `weight / Σweight`
              （表示用の確率）、`buy_prob` は `(weight + stake) / (total_weight + stake)`
              （買付価格）で、分母が違うため両者は一致しません。`prob` の合計が 1 を超える
              イベントも実在します（サーバーの値をそのまま返しています）。候補を比べるときは
              `--stake` を固定してください。
            - **広告を見てコインを取る機能は実装していません。** 広告の付与は AdMob の
              サーバー側検証（SSV）でしか成立せず、クライアントから叩ける経路が存在しません
              （`/ads/reward` は読み取り専用、`/ads/ssv` は署名必須）。アプリで広告を見る必要があります。
            - **クイズは取り消せません。** 削除・編集の API がありません。`quiz --dry-run` で
              中身を確認してから送ってください。
            - ログインは `auth import-token` によるトークン取り込みです。CLI 自身は Google の
              OAuth を回しません（アプリのリダイレクト先がカスタムスキームで、デスクトップや
              サーバーからは受け取れないため）。
            - ミニゲームの `rules_version` は 1 と 2 が通ります。3 は未開放で 409 が返ります。
            - **`schedule run` は常駐プロセスです。** 止めれば予約は実行されません。cron や
              タスクスケジューラから `schedule run --once` を定期実行する使い方もできます。
            - **`--stake` はコインです（ポイントではありません）。** 10〜100,000 の範囲で、
              範囲外はサーバーが 400 で拒否します。CLI も送信前に同じ境界を検査します。
            - **同日 2 回目のミニゲームクリアは無報酬です。** `reward: null` が返り、
              `today.free_done: true` になります。`wave play` はその旨を注記します。
