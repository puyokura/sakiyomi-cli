name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to build the current ref."
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl needs a linker for the cross builds; arm64 on x86 needs gcc-aarch64.
      - name: install musl tooling
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="sakiyomi-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          if [ -f "target/${{ matrix.target }}/release/sakiyomi.exe" ]; then
            cp "target/${{ matrix.target }}/release/sakiyomi.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/sakiyomi" "dist/$NAME/"
          fi
          cp README.md VERIFICATION.md "dist/$NAME/" 2>/dev/null || true
          if [ -f "target/${{ matrix.target }}/release/sakiyomi.exe" ]; then
            (cd "dist/$NAME" && 7z a -tzip "../$NAME.zip" . > /dev/null)
            echo "ASSET=dist/$NAME.zip" >> "$GITHUB_ENV"
          else
            tar -C "dist/$NAME" -czf "dist/$NAME.tar.gz" .
            echo "ASSET=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: verify the packaged binary runs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "dist/sakiyomi-${{ matrix.target }}/sakiyomi.exe" ] && [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/sakiyomi-${{ matrix.target }}/sakiyomi.exe --version
          elif [ "${{ runner.os }}" != "Linux" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            ./dist/sakiyomi-${{ matrix.target }}/sakiyomi --version
          else
            echo "cross-built for ${{ matrix.target }}; not executable on this runner"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sakiyomi-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          # Only the built archives are attached. GitHub shows a digest for each
          # asset on the release page, so a separate checksum file adds nothing.
          files: |
            assets/*.zip
            assets/*.tar.gz
          generate_release_notes: true
          body: |
            ## 変更点
            - **`events updown` の引数を市場シンボルに変えました。** `GET /updown/{X}` の
              `X` はイベント ID ではなく、サブカテゴリから引くシンボルでした（バンドル
              753033 の `{'ビットコイン': 'btc'}`）。イベント ID を渡すと 404 になるのは
              これが理由です。`events updown btc` が通るようになり、`--live` で
              ラウンド一覧（最大 12 件）と現在価格が返ります。
            - 数値のイベント ID を渡した場合は、`GET /events/{id}` で subcategory を調べて
              同じ表でシンボルに変換します。未知のサブカテゴリは推測せず exit 2 で拒否します。
            - VERIFICATION.md §4 の「引数の正体は不明」を、実測で確定した仕様に置き換えました。

            ## 新機能
            - **`events updown <sym> [--live]`**: updown（ビットコイン5分）のラウンドと
              価格履歴を CLI から取得できます。ラウンドの板は `events show <round_id>`、
              買付の見積もりは `buy --dry-run` で、どちらもそのまま動きます。
            - ラウンドの流れ: `events updown btc --live` で `rounds` から開いている ID を取り、
              `events show <id>` で板を見て、`buy --event <id> --option <id> --stake <コイン>`。

            ## 注意点
            - **ラウンドは一括取得では取れません。** `GET /events?ids=` はラウンドに対して
              空配列を返します。単体取得 `GET /events/{id}` を使う `events show` と
              `buy` の見積もりは動きますが、`events list --ids` では取れません。
            - **`--live` の価格履歴は約 20 秒分しか返りません。** 長い期間の判定には
              足りないので、必要なら自分で蓄積してください。`--live` を付けない場合は
              約 30 分（5 秒間隔）の履歴が返ります。
            - **`events updown` の引数はシンボルです。** イベント ID を渡しても変換しますが、
              未知のサブカテゴリ（スポーツなど）はエラーになります。
            - ログインは `auth import-token` によるトークン取り込みです。CLI 自身は Google の
              OAuth を回しません（アプリのリダイレクト先がカスタムスキームで、デスクトップや
              サーバーからは受け取れないため）。
            - **`--stake` はコインです（ポイントではありません）。** 10〜100,000 の範囲で、
              範囲外はサーバーが 400 で拒否します。CLI も送信前に同じ境界を検査します。
            - **同日 2 回目のミニゲームクリアは無報酬です。** `reward: null` が返り、
              `today.free_done: true` になります。`wave play` はその旨を注記します。
